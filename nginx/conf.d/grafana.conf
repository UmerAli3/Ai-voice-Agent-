# =============================================================================
# Grafana Domain Site Configuration: grafana.internexus.tech
# =============================================================================

upstream grafana_service {
    server grafana:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name grafana.internexus.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        limit_req zone=general_limit burst=15 nodelay;

        proxy_pass http://grafana_service;
        proxy_http_version 1.1;

        # WebSocket support for live dashboard graphs
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

