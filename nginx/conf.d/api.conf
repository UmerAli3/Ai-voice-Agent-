# =============================================================================
# API Domain Site Configuration: api.internexus.tech
# =============================================================================

upstream backend_cluster {
    server backend:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HTTP Server (Port 80) - Handles Let's Encrypt ACME Challenge & Reverse Proxying
server {
    listen 80;
    listen [::]:80;
    server_name api.internexus.tech localhost;

    # Let's Encrypt Certbot ACME Webroot Challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # High-throughput Vapi Webhook Endpoint
    location /webhook/vapi {
        limit_req zone=webhook_limit burst=20 nodelay;
        limit_conn addr_conn_limit 20;

        proxy_pass http://backend_cluster/webhook/vapi;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header x-vapi-secret $http_x_vapi_secret;

        client_max_body_size 50M;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # General API Routes & Healthchecks
    location / {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 50M;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}

